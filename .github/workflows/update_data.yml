name: Update Model Data Cache

on:
  schedule:
    # Run twice a day (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run Cache Update Script
        run: node scripts/update_data.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          # Commit only if there are changes to prevent empty commits
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update model data and exchange rates [skip ci]"
          git push
