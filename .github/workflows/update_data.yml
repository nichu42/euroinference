name: Update Model Data Cache

on:
  push:
    branches: [ main ]
    # Only regenerate data when something that affects the generated data.js/html changed
    # (normalization rules, model registry, the generator script, docs, or the workflow itself).
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'unify.js'
      - 'data.js'
      - 'CREDITS.md'
      - 'METHODOLOGY.md'
      - 'PRIVACY.md'
      - 'credits.html'
      - 'methodology.html'
      - 'privacy.html'
      - '.github/workflows/**'
  schedule:
    # Run twice a day (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    # Skip when this push is the bot's own auto-update commit, to avoid re-triggering in a loop.
    if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'Auto-update model data and exchange rates [skip ci]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Pre-commit syntax checks
        run: |
          node --check app.js
          node --check unify.js
          node --check scripts/update_data.js
          node --check scripts/build_credits.js
          node --check scripts/build_methodology.js
          node --check scripts/build_privacy.js
          node --check data.js
          git diff --check

      - name: Run Cache Update Script
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/update_data.js

      - name: Build md -> html docs
        run: |
          node scripts/build_credits.js
          node scripts/build_methodology.js
          node scripts/build_privacy.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js config credits.html methodology.html privacy.html
          # Commit only if there are changes to prevent empty commits
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update model data and exchange rates [skip ci]"
          git push
